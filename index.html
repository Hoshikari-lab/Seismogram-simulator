<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Sismológica México | Registro Profesional IISV</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --border: #000; --bg: #f5f5f5; --accent: #cc0000; --grid: #e5e5e5; }
        body { background-color: var(--bg); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 15px; }

        .panel-control {
            background: #fff; border: 1px solid var(--border); padding: 15px;
            max-width: 1200px; margin: 0 auto 20px auto;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;
            box-shadow: 4px 4px 0px #ccc;
        }
        .grupo { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #666; margin-bottom: 3px; text-transform: uppercase; }
        input { border: 1px solid #999; padding: 5px; font-size: 12px; outline: none; background: #fff; }

        #reporte-area { background: #fff; padding: 25px; border: 1px solid #ccc; max-width: 1240px; margin: 0 auto; }
        
        .header-reporte { 
            text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 15px;
            display: none; 
        }
        .ficha-tecnica {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            text-align: left; font-size: 11px; margin-top: 15px; border: 1px solid #eee; padding: 10px;
            background: #fafafa;
        }

        .grid-estaciones {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); 
            gap: 20px;
        }
        .celda { background: #fff; border: 1.5px solid var(--border); padding: 12px; position: relative; }
        .info {
            font-size: 10px; font-weight: bold; border-bottom: 1.5px solid var(--border);
            margin-bottom: 8px; display: flex; justify-content: space-between; padding-bottom: 5px;
        }

        .canvas-container {
            width: 100%; height: 125px; background: #fff; position: relative; border: 1px solid #ddd;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .btn-ejecutar { grid-column: span 2; background: #000; color: #fff; border: none; padding: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .btn-capturar { grid-column: span 2; background: #444; color: #fff; border: none; padding: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; display: none; }
        .status { position: absolute; bottom: 5px; right: 15px; font-size: 8px; font-weight: bold; color: #999; }
    </style>
</head>
<body>

    <div class="panel-control">
        <div class="grupo"><label>Fecha</label><input type="date" id="e-fecha"></div>
        <div class="grupo"><label>Hora (UTC)</label><input type="time" id="e-hora"></div>
        <div class="grupo"><label>Magnitud</label><input type="number" id="e-mag" value="5.6" step="0.1"></div>
        <div class="grupo"><label>Prof. (km)</label><input type="number" id="e-prof" value="15"></div>
        <div class="grupo"><label>Latitud</label><input type="number" id="e-lat" value="16.50" step="0.01"></div>
        <div class="grupo"><label>Longitud</label><input type="number" id="e-lon" value="-98.45" step="0.01"></div>
        <button class="btn-ejecutar" onclick="lanzarSismo()">Ejecutar Monitoreo</button>
        <button class="btn-capturar" id="btn-cap" onclick="capturarReporte()">Capturar Reporte IISV</button>
    </div>

    <div id="reporte-area">
        <div class="header-reporte" id="tit-rep">
            <h1 style="margin:0; font-size: 22px;">INSTITUTO DE INVESTIGACIONES SÍSMICAS Y VOLCÁNICAS</h1>
            <p style="margin:5px 0; font-size: 11px; letter-spacing: 1px;">REPORTE TÉCNICO DE REGISTROS ACELEROGRÁFICOS - RED MÉXICO</p>
            <div class="ficha-tecnica" id="ficha-datos"></div>
        </div>
        <div class="grid-estaciones" id="main-grid"></div>
    </div>

    <script>
        const grid = document.getElementById('main-grid');
        const btnCap = document.getElementById('btn-cap');
        const titRep = document.getElementById('tit-rep');
        let esActivo = false;
        let tGlobal = 0;
        const MAX_PUNTOS = 600;

        const estaciones = [
            { id: "CJIG", loc: "Chamela, JAL", lat: 19.53, lon: -105.08 },
            { id: "MMIG", loc: "Maruata, MIC", lat: 18.27, lon: -103.35 },
            { id: "ZIIG", loc: "Zihuatanejo, GRO", lat: 17.64, lon: -101.55 },
            { id: "DAIG", loc: "Acapulco, GRO", lat: 16.85, lon: -99.87 },
            { id: "PNIG", loc: "Pinotepa, OAX", lat: 16.34, lon: -98.05 },
            { id: "PEIG", loc: "Pto. Escondido, OAX", lat: 15.86, lon: -97.07 },
            { id: "OXIG", loc: "Oaxaca, OAX", lat: 17.06, lon: -96.72 },
            { id: "HUIG", loc: "Huatulco, OAX", lat: 15.76, lon: -96.13 },
            { id: "CMIG", loc: "Matías Romero, OAX", lat: 16.87, lon: -95.04 },
            { id: "TGIG", loc: "Tuxtla Gtz., CHIS", lat: 16.75, lon: -93.11 },
            { id: "PCIG", loc: "Pijijiapan, CHIS", lat: 15.68, lon: -93.21 },
            { id: "PAVE", loc: "Tapachula, CHIS", lat: 14.90, lon: -92.26 },
            { id: "VRVM", loc: "Venustiano, CDMX", lat: 19.417, lon: -99.11 },
            { id: "LPIG", loc: "La Paz, BCS", lat: 24.10, lon: -110.30 },
            { id: "MBIG", loc: "Mexicali, BC", lat: 32.40, lon: -115.19 },
            { id: "LNIG", loc: "Linares, NL", lat: 24.89, lon: -99.46 },
        ];

        let traces = [];

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function inicializarGrid() {
            grid.innerHTML = ''; traces = [];
            const latE = parseFloat(document.getElementById('e-lat').value);
            const lonE = parseFloat(document.getElementById('e-lon').value);
            const prof = parseFloat(document.getElementById('e-prof').value);

            estaciones.forEach((est, i) => {
                const dHipo = Math.sqrt(Math.pow(calcularDistancia(latE, lonE, est.lat, est.lon), 2) + Math.pow(prof, 2));
                const div = document.createElement('div');
                div.className = 'celda';
                div.innerHTML = `<div class="info"><span>${est.id} | ${est.loc}</span><span style="color:#777">${dHipo.toFixed(1)} km</span></div><div class="canvas-container"><canvas id="c-${i}"></canvas></div><div class="status" id="s-${i}">STANDBY</div>`;
                grid.appendChild(div);
                const can = document.getElementById(`c-${i}`);
                traces.push({ ctx: can.getContext('2d', {alpha: false}), can: can, data: new Array(MAX_PUNTOS).fill(0), dist: dHipo, congelado: false, tLlegada: dHipo / 8.5, detectado: false });
            });
        }

        function motorFisico(index, tiempo) {
            const mag = parseFloat(document.getElementById('e-mag').value);
            const tr = tiempo - traces[index].tLlegada;
            if (tr < 0) return (Math.random() - 0.5) * 0.15;
            if (tr > 0) traces[index].detectado = true;
            const ampMax = Math.pow(10, mag * 0.6) / Math.pow(traces[index].dist, 1.22);
            return (Math.sin(tr*17)*Math.cos(tr*4.2)*(22*tr**2*Math.exp(-tr*0.55))*(ampMax/5.5)) + (Math.random()-0.5)*0.2;
        }

        function lanzarSismo() {
            inicializarGrid(); esActivo = true; tGlobal = 0;
            btnCap.style.display = "none";
        }

        function dibujar() {
            if (esActivo) {
                tGlobal += 0.16;
                // Calculamos cuál es la estación más lejana
                const maxDist = Math.max(...traces.map(t => t.dist));
                // Tiempo suficiente para que la onda llegue y se vea en la estación más lejana
                const tiempoFin = (maxDist / 8.5) + 30; 

                traces.forEach((tr, i) => {
                    if (tr.congelado) return;
                    
                    const val = motorFisico(i, tGlobal);
                    tr.data.push(val); tr.data.shift();

                    // Bloqueo profesional al llegar al 50% O si el tiempo global agota la simulación
                    if ((tr.detectado && Math.abs(tr.data[Math.floor(MAX_PUNTOS/2)]) > 1.5) || tGlobal > tiempoFin) {
                        tr.congelado = true;
                        document.getElementById(`s-${i}`).innerText = "LOCKED (SYNC)";
                        document.getElementById(`s-${i}`).style.color = "red";
                    }

                    const w = tr.can.width = tr.can.offsetWidth, h = tr.can.height = tr.can.offsetHeight, ctx = tr.ctx;
                    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
                    ctx.strokeStyle = "#eee"; ctx.lineWidth = 0.5;
                    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
                    ctx.beginPath(); ctx.lineWidth = 1;
                    for (let j = 0; j < tr.data.length; j++) {
                        const x = (j / MAX_PUNTOS) * w, y = h/2 + (tr.data[j] * 4.5);
                        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        ctx.strokeStyle = (Math.abs(tr.data[j]) > 9) ? "#cc0000" : "#111";
                    }
                    ctx.stroke();
                });

                if (traces.every(t => t.congelado)) { 
                    esActivo = false; 
                    btnCap.style.display = "block"; 
                }
            }
            requestAnimationFrame(dibujar);
        }

        function capturarReporte() {
            document.getElementById('ficha-datos').innerHTML = `
                <div><b>FECHA:</b> ${document.getElementById('e-fecha').value}</div>
                <div><b>HORA ORIGEN:</b> ${document.getElementById('e-hora').value} UTC</div>
                <div><b>MAGNITUD:</b> ${document.getElementById('e-mag').value} Mw</div>
                <div><b>LATITUD:</b> ${document.getElementById('e-lat').value}°N</div>
                <div><b>LONGITUD:</b> ${document.getElementById('e-lon').value}°W</div>
                <div><b>PROFUNDIDAD:</b> ${document.getElementById('e-prof').value} km</div>
            `;
            titRep.style.display = "block";
            html2canvas(document.querySelector("#reporte-area"), { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `REPORTE_IISV_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
                titRep.style.display = "none";
            });
        }

        const d = new Date();
        document.getElementById('e-fecha').value = d.toISOString().split('T')[0];
        document.getElementById('e-hora').value = d.toTimeString().split(' ')[0].substring(0,5);
        inicializarGrid(); dibujar();
    </script>
</body>
</html>
